{% extends "base.html" %}

{% block title %}Contraseña Cambiada{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-success shadow-sm border-0 text-center p-5">
                <i class="bi bi-check-circle-fill text-success mb-3" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mb-3">¡Contraseña Actualizada!</h3>
                <p class="text-muted mb-4">Tu contraseña se ha modificado correctamente. A partir de ahora deberás usar la nueva contraseña para iniciar sesión.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg shadow-sm px-5 rounded-pill">Volver al Inicio</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
