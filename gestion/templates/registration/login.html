{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - SIGES</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .btn-custom { 
            background-color: #1F4A75; 
            border-color: #1F4A75; 
            color: white; 
            border-radius: 8px;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s;
        }
        .btn-custom:hover { 
            background-color: #173859; 
            border-color: #173859; 
            color: white; 
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(31, 74, 117, 0.2);
        }
        
        .form-control {
            border-radius: 8px;
            padding: 0.6rem 1rem;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(31, 74, 117, 0.15);
            border-color: #1F4A75;
            background-color: #ffffff;
        }
        
        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body>

<div class="container fade-in-up">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card login-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4 pb-2">
                        <div class="d-inline-flex align-items-center justify-content-center mb-4">
                            <img src="{% static 'img/logo.png' %}" alt="Profesorado Don Bosco Pío IX" style="height: 100px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                        </div>
                        <p class="text-muted small">Ingresa tus credenciales para continuar</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger bg-danger text-white border-0 small rounded-3 py-2 text-center" role="alert">
                            <i class="bi bi-exclamation-circle me-1"></i> Usuario o contraseña incorrectos.
                        </div>
                    {% endif %}

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show small rounded-3 py-2 text-center" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.8rem;"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.05em;">DNI o Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="12345678" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.05em;">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-custom">Iniciar Sesión</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4 pt-2 border-top">
                        <a href="{% url 'preinscripcion' %}" class="text-decoration-none text-muted small hover-lift d-inline-block" style="transition: all 0.2s;">
                            <i class="bi bi-person-plus me-1"></i> ¿No sos alumno? <span class="text-primary fw-bold">Preinscribite aquí</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
